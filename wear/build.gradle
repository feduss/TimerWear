plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "com.feduss.timerwear"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.feduss.timerwear"
        minSdk = 26
        targetSdk = 36
        versionCode = 39
        versionName = "1.1.4"
        vectorDrawables {
            useSupportLibrary = true
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21

        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    //Modules
    implementation project(path: ':business')
    implementation project(path: ':data')
    implementation project(path: ':utils')
    implementation project(path: ':entity')
    implementation project(path: ':uistate')

    //Kotlin core
    implementation libs.androidx.core.ktx

    //Androidx for legacy support
    implementation libs.androidx.legacy.support.v4

    //Compose wear
    implementation libs.wear.compose.ui.tooling
    implementation libs.wear.compose.foundation
    implementation libs.wear.compose.material
    implementation libs.wear.compose.navigation
    implementation libs.androidx.compose.material3

    //
    implementation libs.wear.remote.interactions
    implementation libs.wear

    // Testing
    androidTestImplementation libs.androidx.compose.ui.test.junit4.explicit
    debugImplementation libs.androidx.compose.ui.tooling.explicit
    debugImplementation libs.androidx.compose.ui.test.manifest.explicit

    // Optional - Integration with ViewModels
    implementation libs.androidx.lifecycle.viewmodel.compose

    //Google pager + scaffold
    implementation libs.horologist.compose.layout
    implementation libs.horologist.composables
    coreLibraryDesugaring libs.desugar.jdk.libs

    //Hilt
    implementation libs.dagger.hilt.android
    ksp libs.dagger.hilt.android.compiler
    implementation libs.androidx.hilt.navigation.compose

    //Gson
    implementation libs.gson

    //Skeleton view
    implementation libs.compose.shimmer

    //APIs for SplashScreen, including compatibility helpers on devices prior Android 12
    implementation libs.androidx.core.splashscreen

    //Reboot helper
    implementation libs.process.phoenix

    //Tooltip
    implementation libs.balloon.compose

    //Firebase
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.crashlytics)
    implementation(libs.firebase.analytics)

    implementation libs.wear.ongoing
}
